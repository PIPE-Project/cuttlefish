---

# NOTE: provisioning/roles/cuttlefish-app/meta/main.yml has prerequisites that run first
# and does a fair bit of work, not just establish common libraries to call!

- name: Remove apache2
  apt:
    name: apache2
    state: absent
  tags: ['nginx', 'apt']

- name: Install nginx
  apt:
    pkg:
      - nginx
    state: present
  tags: ['nginx', 'apt']

- name: Ensure /etc/apt/keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: ['nginx', 'passenger', 'apt']

- name: Fetch Phusion Passenger signing key from keyserver
  # Key ID D870AB033FB45BD1 is Phusion's current SHA256 signing key (rotated from 561F9B9CAC40B2F7).
  # The old auto-software-signing-gpg-key.txt URL only has the old key, so we fetch from keyserver.
  shell: |
    gpg --keyserver keyserver.ubuntu.com --recv-keys D870AB033FB45BD1 && \
    gpg --export D870AB033FB45BD1 > /etc/apt/keyrings/phusion-passenger.gpg
  args:
    creates: /etc/apt/keyrings/phusion-passenger.gpg
  tags: ['nginx', 'passenger', 'apt']

- name: Add Passenger apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/phusion-passenger.gpg] https://oss-binaries.phusionpassenger.com/apt/passenger {{ ansible_distribution_release }} main"
    state: present
    filename: passenger
    update_cache: yes
  tags: ['nginx', 'passenger', 'apt']

- name: Install passenger nginx module
  apt:
    pkg:
      - libnginx-mod-http-passenger
    state: present
  tags: ['nginx', 'passenger', 'apt']

- name: Ensure that deploy owns /srv/www
  file:
    owner: deploy
    group: deploy
    path: /srv/www
    state: directory
  tags: ['app']

- name: Ensure that /srv/www/shared exists
  file:
    path: /srv/www/shared
    owner: deploy
    group: deploy
    state: directory
  tags: ['app']

- name: Ensure git is installed
  apt:
    pkg: git
  tags: ['apt']

- name: Download PostgreSQL apt signing key
  get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/pgdg.asc
    mode: "0644"
  tags: ['postgresql', 'apt']

- name: Add PostgreSQL apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/pgdg.asc] http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg
    update_cache: yes
  tags: ['postgresql', 'apt']

- name: Install PostgreSQL {{ postgresql_version }}
  apt:
    pkg:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-client-{{ postgresql_version }}"
      - libpq-dev
    update_cache: yes
  tags: ['postgresql', 'apt']

- name: Trust local database access
  template:
    src: pg_hba.conf
    dest: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
  tags: ['postgresql']

# Restart immediately so PostgreSQL is available for later tasks
- name: Restart postgresql
  service:
    name: postgresql
    state: restarted
  tags: ['postgresql']

- name: Make sure the right version of postgresql starts at boot
  systemd:
    state: started
    name: "postgresql@{{ postgresql_version }}-main"
  tags: ['postgresql']

# Installing via bash -lc so that RVM is active
- name: Install bundler gem
  command: bash -lc "gem install bundler --version 2.5.16"
  args:
    creates: "/usr/local/lib/rvm/gems/ruby-{{ ruby_version }}/gems/bundler-2.5.16"
  tags: ['ruby', 'rvm']

- name: Install package dependencies for native gem extensions
  apt:
    pkg:
      - g++
      - libssl-dev
  tags: ['ruby', 'apt']

- name: Ensure that .env exists
  template:
    src: env
    dest: /srv/www/shared/.env
    owner: deploy
    group: deploy
  notify: nginx restart
  tags: ['app']

- name: Directory to hold configs for ssl on tracking links
  file:
    path: /etc/cuttlefish-ssl
    owner: deploy
    group: deploy
    state: directory
  tags: ['nginx']

- name: Directory to hold nginx configs for ssl on tracking links
  file:
    path: /etc/cuttlefish-ssl/nginx-sites
    owner: deploy
    group: deploy
    state: directory
  tags: ['nginx']

- name: Generate the overall nginx config
  template:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
  notify: nginx reload
  tags: ['nginx']

- name: Generate the nginx config for the app
  template:
    src: default
    dest: /etc/nginx/sites-available/
    owner: root
    group: root
    mode: "644"
  notify: nginx reload
  tags: ['nginx']

- name: Install python module requirement for ansible creating postgresql db
  apt:
    pkg:
      - python3-psycopg2
      - acl        # required for Ansible become_user to work on Linux
  tags: ['postgresql', 'apt']

- name: Create cuttlefish postgresql database
  postgresql_db:
    name: cuttlefish
  become_user: postgres
  tags: ['postgresql']

- name: Create cuttlefish postgresql role
  postgresql_user:
    db: cuttlefish
    name: cuttlefish
    password: "{{ db_password }}"
    encrypted: yes
  become_user: postgres
  tags: ['postgresql']

- name: Create postgresql role for root so it can do backups
  postgresql_user:
    name: root
    role_attr_flags: SUPERUSER
  become_user: postgres
  tags: ['postgresql']

# PostgreSQL 15+ revoked CREATE on public schema from PUBLIC by default.
# The cuttlefish user needs it explicitly to run migrations.
- name: Grant cuttlefish user full access to public schema
  postgresql_schema:
    database: cuttlefish
    name: public
    owner: cuttlefish
  become_user: postgres
  tags: ['postgresql']

- name: Copy over database configuration for application
  template:
    src: database.yml
    dest: /srv/www/shared/database.yml
    owner: deploy
    group: deploy
  notify: nginx restart
  tags: ['app']

- name: Allow deploy user to reload systemd daemon after changing config
  lineinfile:
    dest: /etc/sudoers
    state: present
    line: 'deploy ALL=(ALL) NOPASSWD: /bin/systemctl daemon-reload'
    validate: 'visudo -cf %s'
  tags: ['app']

- name: Allow deploy user to start cuttlefish service
  lineinfile:
    dest: /etc/sudoers
    state: present
    line: 'deploy ALL=(ALL) NOPASSWD: /bin/systemctl start cuttlefish.target'
    validate: 'visudo -cf %s'
  tags: ['app']

- name: Allow deploy user to stop cuttlefish service
  lineinfile:
    dest: /etc/sudoers
    state: present
    line: 'deploy ALL=(ALL) NOPASSWD: /bin/systemctl stop cuttlefish.target'
    validate: 'visudo -cf %s'
  tags: ['app']

- name: Allow deploy user to restart cuttlefish service
  lineinfile:
    dest: /etc/sudoers
    state: present
    line: 'deploy ALL=(ALL) NOPASSWD: /bin/systemctl restart cuttlefish.target'
    validate: 'visudo -cf %s'
  tags: ['app']

- name: Allow deploy user to check the nginx configuration
  lineinfile:
    dest: /etc/sudoers
    state: present
    line: 'deploy ALL=(ALL) NOPASSWD: /usr/sbin/service nginx configtest'
    validate: 'visudo -cf %s'
  tags: ['app']

- name: Allow deploy user to reload the nginx configuration
  lineinfile:
    dest: /etc/sudoers
    state: present
    line: 'deploy ALL=(ALL) NOPASSWD: /usr/sbin/service nginx reload'
    validate: 'visudo -cf %s'
  tags: ['app']

- name: Allow deploy to read some log files (different from admin group)
  user:
    name: deploy
    groups: adm
    append: yes
  tags: ['app']

- name: Open required ports in UFW
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"    # HTTP — needed for certbot challenge and HTTP→HTTPS redirect
    - "443"   # HTTPS — web UI
    - "2525"  # Cuttlefish SMTP — apps send mail here
  tags: ['app']

# Redis 7 from Ubuntu repos — replaces the old DavidWittman.redis Galaxy role
# which installed Redis 2.8, incompatible with Sidekiq 7's HELLO command.
- name: Install Redis 7 from Ubuntu repos
  apt:
    pkg: redis-server
    state: present
    update_cache: yes
  tags: ['redis', 'apt']

- name: Enable and start Redis
  systemd:
    name: redis-server
    enabled: yes
    state: started
  tags: ['redis']

- name: Install certbot
  apt:
    pkg: certbot
    update_cache: yes
  tags: ['nginx']
  when: certbot_create | default(true)

- name: Create certbot renewal hook directory
  file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: "0755"
  tags: ['cuttlefish']
  when: certbot_create | default(true)

- name: Create /etc/cuttlefish-certs directory for SMTP TLS certs
  file:
    path: /etc/cuttlefish-certs
    state: directory
    owner: deploy
    group: deploy
    mode: "0750"
  tags: ['cuttlefish']

- name: Install certbot renewal hook to copy certs for Cuttlefish SMTP daemon
  copy:
    src: "{{ playbook_dir }}/refresh-cuttlefish-certs.sh"
    dest: /etc/letsencrypt/renewal-hooks/deploy/refresh-cuttlefish-certs.sh
    owner: root
    group: root
    mode: "0755"
  tags: ['cuttlefish']
  when: certbot_create | default(true)

- name: Install certificate using certbot
  include_role:
    name: geerlingguy.certbot
  vars:
    certbot_auto_renew_user: root
    certbot_auto_renew_minute: 10
    certbot_auto_renew_hour: 7
    certbot_auto_renew_options: '--no-self-upgrade --pre-hook "service nginx stop" --post-hook "service nginx start"'
    certbot_create_if_missing: yes
    certbot_certs:
      - email: "{{ certbot_email }}"
        domains:
          - "{{ cuttlefish_domain }}"
  tags: ['cuttlefish']
  when: certbot_create | default(true)

- name: Install New Relic infrastructure agent
  include_role:
    name: newrelic.newrelic-infra
  vars:
    nrinfragent_config:
      license_key: "{{ new_relic_license_key }}"
  tags: ['newrelic']
  when: new_relic_enabled | default(false)

- name: Install Cuttlefish SMTP receiver systemd service
  copy:
    src: "{{ playbook_dir }}/cuttlefish-smtp.service"
    dest: /etc/systemd/system/cuttlefish-smtp.service
    owner: root
    group: root
    mode: "0644"
  notify: systemd daemon-reload
  tags: ['cuttlefish']

- name: Enable and start Cuttlefish SMTP receiver
  systemd:
    name: cuttlefish-smtp
    enabled: yes
    state: started
  tags: ['cuttlefish']

- name: Install Sidekiq background worker systemd service
  copy:
    src: "{{ playbook_dir }}/sidekiq.service"
    dest: /etc/systemd/system/sidekiq.service
    owner: root
    group: root
    mode: "0644"
  notify: systemd daemon-reload
  tags: ['cuttlefish']

- name: Enable and start Sidekiq background worker
  systemd:
    name: sidekiq
    enabled: yes
    state: started
  tags: ['cuttlefish']

- name: Allow deploy user to restart cuttlefish-smtp service
  lineinfile:
    dest: /etc/sudoers
    state: present
    line: 'deploy ALL=(ALL) NOPASSWD: /bin/systemctl restart cuttlefish-smtp'
    validate: 'visudo -cf %s'
  tags: ['app']

- name: Allow deploy user to restart sidekiq service
  lineinfile:
    dest: /etc/sudoers
    state: present
    line: 'deploy ALL=(ALL) NOPASSWD: /bin/systemctl restart sidekiq'
    validate: 'visudo -cf %s'
  tags: ['app']

- name: Daily archiving and deny list removal tasks
  cron:
    name: daily old email archiving
    job: "cd /srv/www/current && /usr/local/lib/rvm/bin/rvm . do bundle exec rake cuttlefish:daily_tasks RAILS_ENV=production"
    user: deploy
    minute: "0"
    hour: "12"
  tags: ['cuttlefish']
