---
- hosts: all
  become: true
  gather_facts: False
  tags: ['python']
  tasks:
  - name: install python3
    raw: test -e /usr/bin/python3 || (apt -y update && apt install -y python3)
    changed_when: False

- hosts: all
  tags: ['verify']
  pre_tasks:
    - name: Verify Ansible meets minimum version requirement
      assert:
        that: "ansible_version.major > 2 or (ansible_version.major == 2 and ansible_version.minor >= 15)"
        msg: "This playbook requires Ansible 2.15 or later (found {{ ansible_version.major }}.{{ ansible_version.minor }})"

- hosts: all
  become: true
  roles:
    - { role: deploy-user, tags: ['deploy_user'] }
    - { role: cuttlefish-app, tags: ['cuttlefish_app'] }
